name: Feature request
description: Propose an improvement with a concrete use case.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and tradeoffs
      description: Describe affected image categories, recovery behavior and alternatives when relevant.
    validations:
      required: true
