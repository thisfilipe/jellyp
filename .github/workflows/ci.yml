name: Build and validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: python3 scripts/audit-publication.py
      - run: dotnet restore JellyP.slnx --locked-mode
      - run: dotnet build JellyP.slnx -c Release --no-restore
      - run: dotnet test JellyP.slnx -c Release --no-build --no-restore
      - run: python3 -m unittest discover -s tests/release -v
      - run: python3 scripts/package.py
      - run: python3 -m compileall -q scripts
