<!DOCTYPE html>

<style>

#JellyPConfigPage { --jp-accent:#005777;--jp-success:#1b6337;--jp-warn:#754b00;--jp-error:#a52f29;--jp-info:#005777;--jp-tint:8%;--jp-sticky-top:64px; }

 } else if (node.dataset.backup) {

 } else if (localId === 'BackupFilter') { S.backupFilter = node.value; S.pages.backups = 0; render(false).catch(showError); }
 else if (node.hasAttribute('data-consent')) applyEnabled();

page.addEventListener('click',event => { const node = event.target.closest('[data-action]'); if (!node || node.disabled) return; event.preventDefault(); handleAction(node).catch(showError); });
// Capturing error avoids broken-image chrome without an inline JS handler. No
// fallback URL is ever requested, especially for an unavailable local slot.
page.addEventListener('error',event => { if (event.target.matches('.jp-preview img')) { const image = event.target; image.parentElement.setAttribute('aria-label',tr('Preview unavailable','Prévia indisponível')); image.remove(); } },true);
async function handleAction(node) {
 const action = node.dataset.action; message();

  else if (action === 'editDraft') go('simulate');
 else if (action === 'analyze') await analyze();
 else if (action === 'abortAnalyze') analyzeController?.abort();
 else if (action === 'copyDefaults') {
   if (!window.confirm(tr('Use Global defaults for this test only? Scope, enabled types and preservation are kept. Automation is unchanged.','Usar Padrões globais só para este teste? Alcance, tipos habilitados e preservação são mantidos. A automação não muda.'))) return;
  const defaults = copy(S.settings.Defaults), old = S.draft;
  defaults.Policies.forEach(policy => { policy.Enabled = old.Policies.find(row => row.Category === policy.Category).Enabled; });
   S.draft = {...old,...defaults,Scope:old.Scope,ItemIds:old.ItemIds,LibraryIds:old.LibraryIds,PreserveOriginals:old.PreserveOriginals}; invalidate(); await render(false); message(tr('Global defaults copied to this test only. Nothing saved; automation unchanged.','Padrões globais copiados só para este teste. Nada salvo; automação inalterada.'));
 } else if (['addItem','addIds','removeItem'].includes(action)) {
  const owner = node.dataset.owner, value = S[owner];
  const ids = action === 'addIds' ? ($(owner + 'Ids').value.match(/\b(?:[a-f\d]{8}-[a-f\d]{4}-[a-f\d]{4}-[a-f\d]{4}-[a-f\d]{12}|[a-f\d]{32})\b/gi) || []) : [node.dataset.id];
  if (!ids.length) throw new Error(tr('Paste valid item IDs or Jellyfin details URLs.','Cole IDs válidos ou links de detalhes do Jellyfin.'));
  value.ItemIds = action === 'removeItem' ? value.ItemIds.filter(id => id32(id) !== id32(ids[0])) : [...new Set([...value.ItemIds.map(id32),...ids.map(id32)])];
  markEdited(owner); await Promise.all([resolveNames(value.ItemIds),inspect(value.ItemIds)]);
  $(owner + 'Selected').innerHTML = selectedItems(owner,value);
  if ($(owner + 'Ids')) $(owner + 'Ids').value = '';
  if (action === 'addItem') $(owner + 'SearchResults').innerHTML = '';
 } else if (['selectPage','selectAll','clearSelection'].includes(action)) {
  let keys = [];
  if (action !== 'clearSelection' && !canSelect()) return;
  if (action === 'selectAll') keys = (await api('JellyP/Plan/' + S.planId + '/Keys?kind=selectable')).Keys;
  else if (action === 'selectPage') keys = [...new Set([...S.selection,...S.planPage.Items.filter(row => ['Convert','Regenerate'].includes(row.Action)).map(row => row.Key)])];
  if (keys.length > 1000) throw new Error(tr('More than 1,000 proposals. Select a smaller subset; nothing was truncated or selected.','Mais de 1.000 propostas. Selecione um subconjunto menor; nada foi truncado ou selecionado.'));
  S.selection = keys; S.review = null; S.pages.review = 0; S.pages.retention = 0; persist();
  for (const input of page.querySelectorAll('[data-plan-key]')) input.checked = keys.includes(input.dataset.planKey);
  await updateBill();
 } else if (action === 'review') { S.pages.review = 0; S.pages.retention = 0; await loadReview(); go('execute',{sub:'review'}); }
 else if (action === 'apply') await mutation(async () => {
  if (!S.review || S.stale || !S.selection.length || S.reviewKeys.join('|') !== S.selection.join('|')) throw new Error(tr('Selection changed. Review again.','Seleção mudou. Revise novamente.'));
  const receipt = await api('JellyP/Plan/' + S.planId + '/Apply','POST',{Keys:[...S.reviewKeys],AuthorizePermanentRemoval:!!$('PermanentAck')?.checked,AuthorizeRetentionPurge:!!$('RetentionAck')?.checked,AuthorizeRetentionFingerprint:S.review.Retention.EligibleCount ? S.review.Retention.Fingerprint : null}); await acceptReceipt(receipt);
 });
 else if (action === 'cancelOperation') await mutation(async () => { await api('JellyP/Executions/' + S.operationId + '/Cancel','POST'); await refreshState(); message(tr('Stop requested. The current transaction finishes safely; committed changes remain.','Parada solicitada. A transação atual termina com segurança; alterações confirmadas permanecem.')); });
 else if (action === 'newSimulation') { S.plan = null; S.planId = null; S.planDraft = null; S.selection = []; S.review = null; S.stale = false; persist(); go('simulate'); }
 else if (action === 'saveAuto') await mutation(saveAuto);
 else if (action === 'saveSettings') await mutation(saveSettings);
 else if (action === 'selectAllBackups') {
  const response = await api('JellyP/Backups/Keys?filter=' + (S.sub === 'retire' ? 'retirable' : 'restorable'));
  if (response.Keys.length > 200) throw new Error(tr('More than 200 originals. Select a smaller subset; nothing was truncated or selected.','Mais de 200 originais. Selecione um subconjunto menor; nada foi truncado ou selecionado.'));
  S[S.sub === 'retire' ? 'retire' : 'restore'] = response.Keys; persist(); updateBackupSelection();
 } else if (action === 'selectBackupPage') {
  const retire = S.sub === 'retire', key = retire ? 'retire' : 'restore', keys = [...new Set([...S[key],...S.backups.Items.filter(row => retire ? row.Retirable : row.Restorable).map(row => row.RecordId)])];
  if (keys.length > 200) throw new Error(tr('Select at most 200 originals. Nothing was truncated.','Selecione no máximo 200 originais. Nada foi truncado.'));
  S[key] = keys; persist(); updateBackupSelection();
 } else if (action === 'clearBackups') { S[S.sub === 'retire' ? 'retire' : 'restore'] = []; persist(); updateBackupSelection(); }
 else if (action === 'reviewBackups' || action === 'reviewOneBackup') await reviewBackups(node.dataset.id);
 else if (action === 'closeDialog') closeDialog();
 else if (action === 'confirmBackup') await mutation(async () => {
  if (!$('BackupAck').checked || !dialogContext) return;
  const context = dialogContext, receipt = await api('JellyP/Backups/' + (context.retire ? 'RetireSelected' : 'Restore'),'POST',{RecordIds:context.keys,...(context.retire ? {AuthorizePermanentRemoval:true} : {})}); closeDialog(); await acceptReceipt(receipt);
 });
 else if (action === 'recover') {
  if (!window.confirm(tr('Recover this individual uncertain transaction from its verified original? This is not a batch action.','Recuperar esta transação incerta individual a partir do original verificado? Não é ação em lote.'))) return;
  await mutation(async () => { await api('JellyP/Rollback/' + node.dataset.id,'POST'); invalidate(); await render(false); message(tr('Individual recovery request completed. Review current evidence.','Solicitação de recuperação individual concluída. Confira a evidência atual.')); });
 } else if (action === 'page') {
  const list = node.dataset.list, offset = Number(node.dataset.offset);
  if (list === 'dialog') { dialogContext.offset = offset; renderBackupDialog(); $('JpRangedialog')?.focus(); return; }
  S.pages[list] = offset;
  if (list === 'review' || list === 'retention') { await loadReview(); $('JpMain').innerHTML = reviewView(); }
  else if (list === 'operation') { await loadOperation(); $('JpExecutionBody').innerHTML = executionBody(); }
  else await render(false);
  $('JpRange' + list)?.focus(); persist();
 }
}
page.addEventListener('viewshow',async () => {
  visible = true; startStickyLayout(); readRoute(); Dashboard.showLoadingMsg();

  const [settings,libraries,plugins,tasks,nativeTasks] = await Promise.all([api('JellyP/Settings'),api('Library/VirtualFolders'),api('Plugins'),api('JellyP/Tasks').catch(() => null),api('ScheduledTasks').catch(() => null)]);
  if (!visible) return;
  S.settings = settings; S.libraries = libraries.filter(row => row.ItemId); S.tasks = tasks; S.nativeTasks = nativeTasks; S.activeId = tasks?.ActiveOperationId;
  {
   let saved; try { saved = JSON.parse(sessionStorage.getItem(storageKey)); } catch (_) { /* Server defaults are safe. */ }
   if (saved) for (const key of ['draft','auto','cfg','autoDirty','cfgDirty','planId','planDraft','stale','selection','operationId','restore','retire','pages','signature']) if (Object.prototype.hasOwnProperty.call(saved,key)) S[key] = saved[key];
   S.draft ||= {...copy(settings.Defaults),Scope:'libraries',ItemIds:[],LibraryIds:[]}; S.auto ||= copy(settings.Automation); S.cfg ||= {Defaults:copy(settings.Defaults),Globals:copy(settings.Globals)};
   if (S.signature && S.signature !== signature(settings)) invalidate();
   S.signature = signature(settings); initialized = true;
  }
  readRoute();
  // Refresh clean editors from the authoritative server, but never discard an
  // unsaved draft when another view (or another administrator) saved settings.
  if (!S.autoDirty) S.auto = copy(settings.Automation);
  if (!S.cfgDirty) S.cfg = {Defaults:copy(settings.Defaults),Globals:copy(settings.Globals)};
  if (!S.planId) { S.plan = null; S.review = null; }
  if (S.planId) { try { S.plan = await api('JellyP/Plan/' + S.planId); if (S.plan.OperationId) { S.operationId = S.plan.OperationId; S.selection = []; S.review = null; } } catch (error) { S.stale = true; S.plan = null; showError(error); } }
  if (S.activeId) S.operationId = S.activeId;
  const plugin = plugins.find(row => id32(row.Id) === id32(pluginId)); $('JpVersion').textContent = plugin ? 'v' + plugin.Version : '';
  await resolveNames([...S.draft.ItemIds,...S.auto.ItemIds]); await render(); schedulePoll();
 } catch (error) { showError(error); if (!initialized) $('JpMain').innerHTML = heading(tr('JellyP unavailable','JellyP indisponível'),tr('Check administrator authentication and plugin loading, then reload. No settings were saved.','Confira a autenticação de administrador e o carregamento do plugin; depois recarregue. Nenhum ajuste foi salvo.')); }
 finally { Dashboard.hideLoadingMsg(); }
});
page.addEventListener('viewhide',() => { visible = false; stopStickyLayout(); clearTimeout(pollTimer); clearTimeout(searchTimer); searchSequence++; renderSequence++; billingSequence++; analyzeController?.abort(); if ($('JpDialog').open) closeDialog(); persist(); });
function visibilityChanged() { if (visible) { if (document.hidden) clearTimeout(pollTimer); else refreshState().then(schedulePoll).catch(showError); } }
document.addEventListener('visibilitychange',visibilityChanged);
page.addEventListener('viewdestroy',() => {
  visible = false; stopStickyLayout(); clearTimeout(pollTimer); clearTimeout(searchTimer);

 // Do not persist that old view again here; viewhide already saved its draft.
});
